<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F3E9E2">
  <title>抽選会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=DM+Sans:opsz,wght@9..40,400..800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="lottery">
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <main class="wrap">
    <header class="brand">
      <p class="brand-kicker">みんまち<span>DROP</span></p>
      <h1 id="eventName" class="brand-title">抽選会</h1>
    </header>

    <!-- 抽選の演出（どの画面でも表示） -->
    <div id="stage" class="stage" data-state="idle" aria-hidden="true">
      <div class="stage-ring"></div>
      <div class="orb">
        <span class="piece p1"></span>
        <span class="piece p2"></span>
        <span class="piece p3"></span>
        <span class="piece p4"></span>
        <span class="piece p5"></span>
        <span class="core"><span class="core-text" id="coreText">?</span></span>
      </div>
      <div class="stage-flash"></div>
    </div>

    <section data-view="loading" class="panel center">
      <p class="status-text">読み込み中<span class="dots"></span></p>
    </section>

    <section data-view="nocode" class="panel card center" hidden>
      <h2 class="h2">会場のQRコードから開いてください</h2>
      <p class="muted">抽選は会場に掲示しているQRコードから参加できます。</p>
    </section>

    <section data-view="closed" class="panel card center" hidden>
      <h2 class="h2">現在は受付時間外です</h2>
      <p class="muted" id="closedText"></p>
    </section>

    <section data-view="ready" class="panel center" hidden>
      <p class="lead">ボタンを押して、<br>今日の運をためしてみよう。</p>
      <button id="drawBtn" class="cta" type="button">
        <span>抽選する</span>
        <span class="cta-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <p class="note">抽選は1台につき1回です。ボタンを押すと結果が確定します。</p>
    </section>

    <section data-view="drawing" class="panel center" hidden>
      <p class="status-text status-text-en" id="drawingText" aria-live="polite">MIXING...</p>
    </section>

    <section data-view="win" class="panel center" hidden>
      <p class="result-en">YOU WIN!</p>
      <div class="card result-card">
        <p class="result-label">当たり</p>
        <h2 class="prize" id="prizeName"></h2>
        <div id="redeemBox">
          <div id="qr" class="qr" role="img" aria-label="引換用QRコード"></div>
          <p class="code-label">引換コード</p>
          <p class="code" id="redeemCode"></p>
          <p class="muted small">引換所でこの画面をスタッフにお見せください。</p>
          <p class="muted small" id="deadlineText"></p>
        </div>
        <div id="redeemedBox" hidden>
          <p class="pill pill-done">引換済み</p>
          <p class="muted" id="redeemedText"></p>
        </div>
      </div>
    </section>

    <section data-view="lose" class="panel center" hidden>
      <p class="result-en result-en-lose">SEE YOU!</p>
      <div class="card result-card">
        <p class="result-label result-label-lose">はずれ</p>
        <h2 class="h2">ざんねん…</h2>
        <p class="muted">ご参加ありがとうございました。<br>またこの街で会いましょう。</p>
      </div>
    </section>

    <section data-view="error" class="panel card center" hidden>
      <h2 class="h2">うまく読み込めませんでした</h2>
      <p id="errorText" class="muted"></p>
      <button id="retryBtn" class="btn" type="button">もう一度試す</button>
    </section>

    <p class="foot">この端末の抽選結果は、この画面にいつでも表示されます。</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/lottery.js"></script>
</body>
</html>
