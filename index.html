<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F3E9E2">
  <title>特典抽選会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=DM+Sans:opsz,wght@9..40,400..800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="lottery lp">
  <main class="wrap">
    <header class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="みんまちDROP for 中之島" width="262" height="160">
      <h1 id="eventName" class="brand-title">特典抽選会</h1>
    </header>

    <!-- ユーザーID・ニックネーム・スタンプ数の入力（遷移元サイトから渡す仕様が決まるまでの仮） -->
    <section data-view="entry" class="panel card">
      <p class="lead center">ユーザーID・ニックネーム・<br>スタンプ数を入力してください。</p>
      <form id="entryForm" class="form" novalidate>
        <label>ユーザーID
          <input id="userId" type="text" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        </label>
        <label>ニックネーム
          <input id="nickname" type="text" maxlength="30" autocomplete="nickname" required>
        </label>
        <label>スタンプ数
          <input id="points" type="number" inputmode="numeric" min="0" step="1" required>
        </label>
        <button class="btn btn-primary btn-xl" type="submit">次へ</button>
        <p class="error" id="entryError" role="alert"></p>
      </form>
    </section>

    <section data-view="loading" class="panel center" hidden>
      <p class="status-text status-text-en">Loading...</p>
    </section>

    <!-- スタンプ数に応じたボタン -->
    <section data-view="tiers" class="panel" hidden>
      <div class="summary">
        <span><strong id="sumNick"></strong> さん</span>
        <span><strong id="sumPoints"></strong> スタンプ</span>
        <button id="changeBtn" class="link" type="button">入力し直す</button>
      </div>
      <p class="lead center" id="tierLead"></p>
      <div id="tierList" class="tier-list"></div>
      <p class="note center">ボタンを押すとアンケートに進みます。抽選は1人1回です。</p>
    </section>

    <section data-view="nocode" class="panel card center" hidden>
      <h2 class="h2">会場のQRコードから開いてください</h2>
      <p class="muted">抽選は会場に掲示しているQRコードから参加できます。</p>
    </section>

    <section data-view="closed" class="panel card center" hidden>
      <h2 class="h2">現在は受付時間外です</h2>
      <p class="muted" id="closedText"></p>
    </section>

    <section data-view="error" class="panel card center" hidden>
      <h2 class="h2">うまく読み込めませんでした</h2>
      <p id="errorText" class="muted"></p>
      <button id="retryBtn" class="btn" type="button">もう一度試す</button>
    </section>

    <div class="center rally-box">
      <a class="btn js-rally" href="#">スタンプラリーに戻る</a>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/lp.js"></script>
</body>
</html>
