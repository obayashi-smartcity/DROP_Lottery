<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F3E9E2">
  <title>特典抽選ページ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=DM+Sans:opsz,wght@9..40,400..800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <!-- CSS・JS は ?v=<画面のバージョン> 付きで読み込む（キャッシュで古いファイルと混ざらないように）。
       画面のバージョンを上げるときは、assets/config.js の APP_VERSION と、3つの HTML の ?v= をすべて同じ値に変える（README） -->
  <link rel="stylesheet" href="assets/style.css?v=v1.0.3">
  <!-- 背景色（config.js の BG_COLOR）は、ページを描く前に当てる（theme.js。ベージュが一瞬見えないように） -->
  <script src="assets/config.js?v=v1.0.3"></script>
  <script src="assets/theme.js?v=v1.0.3"></script>
</head>
<body class="lottery lp">
  <!-- 画面のバージョン（右上。config.js の APP_VERSION） -->
  <p class="app-version js-app-version" hidden></p>
  <main class="wrap">
    <header class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="みんまちDROP for 中之島" width="262" height="160">
      <h1 id="eventName" class="brand-title">特典抽選ページ</h1>
    </header>

    <!-- 遷移元（スタンプラリー）から ?account_id=…&point=… で来なかったとき -->
    <section data-view="noparam" class="panel card center" hidden>
      <h2 class="h2">スタンプラリーのページから<br>開いてください</h2>
      <p class="muted">抽選にはスタンプラリーのページから進んでください。</p>
    </section>

    <section data-view="loading" class="panel center">
      <p class="status-text status-text-en">Loading...</p>
    </section>

    <!-- スタンプ数に応じたボタン -->
    <section data-view="tiers" class="panel" hidden>
      <div class="summary">
        <span><strong id="sumPoints"></strong> スタンプ</span>
      </div>
      <p class="lead center" id="tierLead"></p>
      <div id="tierList" class="tier-list"></div>
      <p class="note center">ボタンを押すとアンケートに進みます。抽選は1人1回です。</p>
    </section>

    <section data-view="nocode" class="panel card center" hidden>
      <h2 class="h2">会場のQRコードから開いてください</h2>
      <p class="muted">抽選は会場に掲示しているQRコードから参加できます。</p>
    </section>

    <section data-view="closed" class="panel card center" hidden>
      <h2 class="h2">現在は受付時間外です</h2>
      <p class="muted" id="closedText"></p>
    </section>

    <section data-view="error" class="panel card center" hidden>
      <h2 class="h2">うまく読み込めませんでした</h2>
      <p id="errorText" class="muted"></p>
      <button id="retryBtn" class="btn" type="button">もう一度試す</button>
    </section>

    <div class="center rally-box">
      <a class="btn js-rally" href="#">スタンプラリーに戻る</a>
    </div>

  </main>

  <script src="assets/api.js?v=v1.0.3"></script>
  <script src="assets/lp.js?v=v1.0.3"></script>
</body>
</html>
