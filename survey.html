<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F3E9E2">
  <title>特典抽選ページ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=DM+Sans:opsz,wght@9..40,400..800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <!-- CSS・JS は ?v=<画面のバージョン> 付きで読み込む（キャッシュで古いファイルと混ざらないように）。
       画面のバージョンを上げるときは、assets/config.js の APP_VERSION と、3つの HTML の ?v= をすべて同じ値に変える（README） -->
  <link rel="stylesheet" href="assets/style.css?v=v1.0.3">
  <!-- 背景色（config.js の BG_COLOR）は、ページを描く前に当てる（theme.js。ベージュが一瞬見えないように） -->
  <script src="assets/config.js?v=v1.0.3"></script>
  <script src="assets/theme.js?v=v1.0.3"></script>
</head>
<body class="lottery survey">
  <!-- 画面のバージョン（右上。config.js の APP_VERSION） -->
  <p class="app-version js-app-version" hidden></p>
  <main class="wrap">
    <header class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="みんまちDROP for 中之島" width="262" height="160">
      <h1 class="brand-title">特典抽選ページ</h1>
    </header>

    <section data-view="form" class="panel" hidden>
      <div class="summary">
        <span id="sumTier"></span>
      </div>
      <p class="lead center">スタンプラリーの感想を<br>お聞かせください。</p>
      <form id="surveyForm" class="card survey-form" novalidate>
        <div id="questions"></div>
        <p class="error center" id="surveyError" role="alert"></p>
        <div class="center">
          <button id="submitBtn" class="cta" type="submit">
            <span>抽選する</span>
            <span class="cta-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </button>
          <p class="note">抽選は1人1回です。ボタンを押すと結果が確定します。</p>
        </div>
      </form>
    </section>

    <section data-view="sending" class="panel center" hidden>
      <p class="status-text">送信中<span class="dots"></span></p>
      <p class="muted small" id="sendingNote" aria-live="polite" hidden>混雑しています。<br>自動で再試行しています</p>
    </section>

  </main>

  <script src="assets/survey-config.js?v=v1.0.3"></script>
  <script src="assets/api.js?v=v1.0.3"></script>
  <script src="assets/survey.js?v=v1.0.3"></script>
</body>
</html>
